server:
  port: 8082

spring:
  application:
    name: stock-analysis-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/stock_analysis?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

history:
  datasource:
    jdbc-url: jdbc:mysql://mysql:3306/stock_history?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:hadoop123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  redis:
    host: localhost
    port: 6379

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.stock.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1
  configuration:
    map-underscore-to-camel-case: true
    # 默认不指定 log-impl；如需查看 SQL 日志，可在 dev profile 中启用：
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# AI 对话服务配置
ai:
  service:
    url: http://localhost:8000

logging:
  level:
    com.stock: debug
