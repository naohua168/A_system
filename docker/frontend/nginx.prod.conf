# ============================================================
# Nginx 生产配置 — 安全 + 性能 + 缓存 优化
# ============================================================

# 隐藏 Nginx 版本号
server_tokens off;

# 限制客户端请求体大小（防止大文件攻击）
client_max_body_size 10m;

# 超时配置
proxy_connect_timeout 30s;
proxy_send_timeout    30s;
proxy_read_timeout    60s;

# SSL 配置（如有证书，取消注释）
# ssl_protocols TLSv1.2 TLSv1.3;
# ssl_prefer_server_ciphers on;
# ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

server {
    listen 80;
    server_name localhost;

    # ====== Gzip 压缩 ======
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/x-javascript
        application/xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ====== 静态资源 ======
    root /usr/share/nginx/html;
    index index.html;

    # ====== 安全头 ======
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ====== SPA 路由 ======
    location / {
        try_files $uri $uri/ /index.html;

        # HTML 不缓存（确保 SPA 更新后立即生效）
        location ~* \.html$ {
            expires -1y;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        }

        # 静态资源（JS/CSS/字体）启用强缓存 + 内容哈希
        location ~* \.(?:js|css|woff2?|ttf|eot|svg)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # 图片缓存
        location ~* \.(?:png|jpg|jpeg|gif|ico|webp)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
    }

    # ====== API 反向代理 ======
    location /api/ {
        proxy_pass http://backend:8082/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（用于 SSE/WebSocket 推送）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 缓冲
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # ====== AI 服务反向代理 ======
    location /ai/ {
        proxy_pass http://ai-service:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 响应可能较长，延长超时
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # ====== 健康检查（不记录日志）=====
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ====== 拒绝访问隐藏文件 ======
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
