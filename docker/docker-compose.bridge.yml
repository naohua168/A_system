# ============================================================
# 网络桥接配置 (v4)
# 声明跨 Compose 的外部网络
# ============================================================
# 用法:
#   docker compose -f docker-compose.collector.yml \
#                  -f docker-compose.bridge.yml \
#                  up -d
# ============================================================

networks:
  app-net:
    external: true
    name: app-net
  collector-net:
    external: true
    name: collector-net
