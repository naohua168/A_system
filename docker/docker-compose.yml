# ============================================================
# A股全栈量化平台 — Docker Compose (v4 — 简化版)
# ============================================================
# 数据流:
#   采集器 → CSV → auto_seed.py(纯socket RESP) → Redis → 前端
#   MySQL 仅存业务数据 (user/watchlist/ai_chat/analysis_result)
#
# 用法:
#   # 启动采集层
#   docker compose -f docker-compose.bridge.yml -f docker-compose.collector.yml up -d
#
#   # 启动应用层
#   docker compose up -d
#
#   # 生产环境
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

name: stock-platform

services:
  # ================================================================
  # 存储层
  # ================================================================

  mysql:
    image: mysql:8.0
    container_name: mysql
    hostname: mysql
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/init_history.sql:/docker-entrypoint-initdb.d/init_history.sql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-hadoop123}
      MYSQL_DATABASE: stock_analysis
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --character-set-client-handshake=FALSE
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-hadoop123}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - bigdata-net

  redis:
    image: redis:7-alpine
    container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --save 300 10
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
    networks:
      - bigdata-net

  # ================================================================
  # 应用服务层
  # ================================================================

  ai-service:
    build:
      context: ../ai-service
      dockerfile: ../docker/ai-service/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-latest}
    image: stock-ai-service:${APP_VERSION:-latest}
    container_name: ai-service
    hostname: ai-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"
    volumes:
      - ai-service-logs:/app/logs
    environment:
      - AI_SERVICE_HOST=0.0.0.0
      - AI_SERVICE_PORT=8000
      - BACKEND_API_URL=http://backend:8082/api
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY:-}
      - SILICONFLOW_MODEL=${SILICONFLOW_MODEL:-Qwen/Qwen2.5-72B-Instruct}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_API_KEY=${AI_API_KEY:-}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_DATABASE=stock_analysis
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-hadoop123}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - bigdata-net

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile.dev
    image: stock-backend:${APP_VERSION:-latest}
    container_name: backend
    hostname: backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8082:8082"
    volumes:
      - backend-logs:/app/logs
      - ../analysis-algorithms:/analysis-algorithms:ro
    environment:
      - TZ=Asia/Shanghai
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-prod}
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/stock_analysis?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-hadoop123}
      - HISTORY_DATASOURCE_JDBC_URL=jdbc:mysql://mysql:3306/stock_history?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      - HISTORY_DATASOURCE_USERNAME=${MYSQL_USER:-root}
      - HISTORY_DATASOURCE_PASSWORD=${MYSQL_PASSWORD:-hadoop123}
      - SPRING_REDIS_HOST=redis
      - SPRING_REDIS_PORT=6379
      - SPRING_REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - AI_SERVICE_URL=http://ai-service:8000
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/ | grep -q ."]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    networks:
      - bigdata-net

  frontend:
    build:
      context: ..
      dockerfile: docker/frontend/Dockerfile
      args:
        - APP_VERSION=${APP_VERSION:-latest}
    image: stock-frontend:${APP_VERSION:-latest}
    container_name: frontend
    hostname: frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - bigdata-net

# ============================================================
# 命名卷
# ============================================================
volumes:
  mysql-data:
    name: stock-mysql-data
  redis-data:
    name: stock-redis-data
  backend-logs:
    name: stock-backend-logs
  ai-service-logs:
    name: stock-ai-logs

# ============================================================
# 网络
# ============================================================
networks:
  bigdata-net:
    name: bigdata-net
    external: true
