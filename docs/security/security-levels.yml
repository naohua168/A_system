# ============================================================
# 安全层级配置
# 基金股票智能分析系统 — 分层账户管理体系
# ============================================================

# ── 安全层级定义（从低到高） ──
levels:

  # ==================== L1: 普通用户 ====================
  - id: USER
    name: "普通用户"
    level: 1
    description: "基础用户，可浏览行情数据和使用基本功能"
    
    # 密码复杂度要求
    password_policy:
      min_length: 8
      max_length: 32
      require_uppercase: true       # 至少1个大写字母
      require_lowercase: true       # 至少1个小写字母
      require_digit: true           # 至少1个数字
      require_special: false        # 不要求特殊字符
      max_consecutive_repeat: 3     # 最大连续重复字符数
      expiry_days: 90               # 密码过期天数
      history_count: 3              # 不能与最近3次密码相同
    
    # 登录策略
    login_policy:
      max_retry: 5                  # 最大登录尝试次数
      lockout_minutes: 30           # 锁定时间（分钟）
      session_timeout_minutes: 60   # 会话超时（分钟）
      max_sessions: 2               # 最大并发会话数
      require_mfa: false            # 不要求多因素认证
    
    # 访问权限列表
    permissions:
      # ── 股票模块 ──
      - "stock:list"                # 查看股票列表
      - "stock:detail"              # 查看个股详情
      - "stock:kline"               # 查看K线数据
      - "stock:search"              # 搜索股票
      - "stock:industries"          # 查看行业列表
      
      # ── 基金模块 ──
      - "fund:list"                 # 查看基金列表
      - "fund:detail"               # 查看基金详情
      - "fund:nav"                  # 查看基金净值
      
      # ── 分析模块 ──
      - "analysis:basic"            # 基础分析（收益率）
      - "analysis:trend"            # 趋势分析
      - "analysis:sector"           # 行业排行
      
      # ── 信号模块 ──
      - "signal:hot-reason"         # 题材归因
      - "signal:dragon-tiger"       # 龙虎榜
      - "signal:northbound"         # 北向资金
      
      # ── AI对话模块 ──
      - "ai:chat"                   # AI对话
      - "ai:status"                 # AI状态
      
      # ── 自选模块 ──
      - "watchlist:view"            # 查看自选
      - "watchlist:manage"          # 管理自选
      
      # ── 基础功能 ──
      - "profile:view"              # 查看个人信息
      - "profile:update"            # 更新个人信息

  # ==================== L2: 高级用户 ====================
  - id: PREMIUM_USER
    name: "高级用户"
    level: 2
    description: "付费用户，可访问高级分析、导出数据、更大API配额"
    
    password_policy:
      min_length: 10
      max_length: 40
      require_uppercase: true
      require_lowercase: true
      require_digit: true
      require_special: true         # 要求特殊字符
      max_consecutive_repeat: 2
      expiry_days: 60
      history_count: 5
    
    login_policy:
      max_retry: 5
      lockout_minutes: 30
      session_timeout_minutes: 120
      max_sessions: 5
      require_mfa: true             # 要求多因素认证
    
    permissions:
      # 继承普通用户所有权限
      - "stock:*"                   # 股票模块全部权限
      - "fund:*"                    # 基金模块全部权限
      - "analysis:*"                # 分析模块全部权限（含相关性和筛选）
      - "signal:*"                  # 信号模块全部权限（含解禁、行业对比）
      - "ai:*"                      # AI模块全部权限
      - "watchlist:*"               # 自选模块全部权限
      - "profile:*"                 # 个人信息全部权限
      
      # 高级用户专属权限
      - "analysis:correlation"      # 相关性分析
      - "analysis:filter"           # 多条件筛选
      - "analysis:technical"        # 技术指标分析
      - "data:export-csv"           # 导出CSV
      - "data:export-excel"         # 导出Excel
      - "signal:lockup"             # 限售解禁
      - "signal:industry-compare"   # 行业对比
      - "signal:fund-flow"          # 资金流向
      - "portfolio:manage"          # 投资组合管理

  # ==================== L3: 管理员 ====================
  - id: ADMIN
    name: "管理员"
    level: 3
    description: "系统管理员，可管理用户、数据采集、系统配置"
    
    password_policy:
      min_length: 12
      max_length: 50
      require_uppercase: true
      require_lowercase: true
      require_digit: true
      require_special: true
      max_consecutive_repeat: 2
      expiry_days: 30
      history_count: 5
    
    login_policy:
      max_retry: 3
      lockout_minutes: 60
      session_timeout_minutes: 240
      max_sessions: 3
      require_mfa: true
    
    permissions:
      # 继承高级用户全部权限
      - "*:read"                    # 所有模块的读取权限
      
      # 用户管理
      - "user:list"                 # 用户列表
      - "user:detail"               # 用户详情
      - "user:create"               # 创建用户
      - "user:update"               # 更新用户
      - "user:disable"              # 禁用用户
      - "user:enable"               # 启用用户
      - "user:reset-password"       # 重置密码
      - "user:view-logs"            # 查看用户操作日志
      
      # 数据管理
      - "data:collector:start"      # 启动数据采集
      - "data:collector:stop"       # 停止数据采集
      - "data:collector:status"     # 采集器状态
      - "data:pipeline:run"         # 运行批处理
      - "data:sync-mysql"           # 同步到MySQL
      - "data:upload-hdfs"          # 上传到HDFS
      
      # 系统管理
      - "system:config:view"        # 查看系统配置
      - "system:config:update"      # 更新系统配置
      - "system:logs:view"          # 查看系统日志
      - "system:health"             # 系统健康检查
      - "system:monitor"            # 系统监控

  # ==================== L4: 超级管理员 ====================
  - id: SUPER_ADMIN
    name: "超级管理员"
    level: 4
    description: "系统超级管理员，拥有全部系统权限"
    
    password_policy:
      min_length: 16
      max_length: 64
      require_uppercase: true
      require_lowercase: true
      require_digit: true
      require_special: true
      max_consecutive_repeat: 1
      expiry_days: 15
      history_count: 10
    
    login_policy:
      max_retry: 3
      lockout_minutes: 120
      session_timeout_minutes: 480
      max_sessions: 2
      require_mfa: true
    
    permissions:
      - "*:*"                       # 全部权限
      
      # 高级管理权限
      - "admin:*"                   # 所有管理功能
      - "security:levels:view"      # 查看安全层级
      - "security:levels:update"    # 更新安全层级配置
      - "security:audit:view"       # 安全审计日志
      - "security:audit:export"     # 导出审计日志
      - "system:config:*"           # 系统配置全部
      - "user:delete"               # 删除用户
      - "user:change-role"          # 变更用户角色

# ── 全局安全设置 ──
global:
  # 密码哈希算法
  password_hash_algorithm: "BCRYPT"
  
  # JWT配置
  jwt:
    algorithm: "HS256"
    default_expiry_ms: 86400000     # 24小时
    refresh_expiry_ms: 2592000000   # 30天
  
  # 全局登录限制
  login:
    global_max_retry: 10            # 全局限制: 10次错误后锁定IP
    global_lockout_minutes: 60      # IP锁定60分钟
  
  # 审计日志
  audit:
    enabled: true
    log_login: true                 # 记录登录事件
    log_operation: true             # 记录操作事件
    log_sensitive: true             # 记录敏感操作
    retention_days: 365             # 日志保留天数
  
  # 会话管理
  session:
    enforce_single_device: false     # 不强制单设备登录
    allow_remember_me: true          # 允许记住登录
    remember_me_days: 7              # 记住登录有效期
